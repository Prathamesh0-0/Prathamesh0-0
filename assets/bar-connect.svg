<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 44" width="840" height="44" role="img" aria-label="Open A Connection"><title>Open A Connection</title><style>text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.rec{animation:rec 1.6s ease-in-out infinite}@keyframes rec{0%,100%{opacity:1}50%{opacity:.25}}.p{animation:p 7s linear infinite}@keyframes p{to{transform:translateX(1000px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="clip"><rect x="1" y="1" width="838" height="42" rx="9"/></clipPath><linearGradient id="p" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#f0b73f" stop-opacity="0"/><stop offset="1" stop-color="#f0b73f"/></linearGradient></defs><rect x=".5" y=".5" width="839" height="43" rx="10" fill="#0b0e12" stroke="#222934"/><g clip-path="url(#clip)"><rect class="p" style="animation-delay:-4.4s" x="-140" y="41" width="140" height="2" fill="url(#p)"/></g><text x="20" y="27" fill="#f0b73f" font-size="12" xml:space="preserve" font-weight="700">// 05</text><text x="74" y="27" fill="#f4f1ea" font-size="13" xml:space="preserve" font-weight="700" letter-spacing="2.6">OPEN A CONNECTION</text><text x="820" y="27" fill="#919baa" font-size="11" xml:space="preserve" text-anchor="end">three packets, then say hello</text></svg>
